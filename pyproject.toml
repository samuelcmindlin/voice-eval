[project]
name = "parity"
version = "0.1.0"
description = "Voice-text parity benchmark: pilot harness"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "openai>=1.50",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Local speech recognition for the second-transcript check. Decode audio with ffmpeg
# and pass a numpy array: faster-whisper's own file decoding fails with current PyAV.
asr = ["faster-whisper", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
